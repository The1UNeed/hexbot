name: Upload an existing Hexbot build

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: EAS build ID to upload without rebuilding

defaults:
  tools:
    node: 26.5.0
    pnpm: 10.29.3

jobs:
  testflight:
    name: Upload to TestFlight
    type: testflight
    params:
      build_id: ${{ inputs.build_id }}
      profile: production
      external_groups: [Website0]
      changelog: The latest Hexbot nightly. Pair it with your daemon and tell us what breaks.
