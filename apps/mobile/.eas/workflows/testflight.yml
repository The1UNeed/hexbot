name: Hexbot TestFlight

on:
  workflow_dispatch: {}

defaults:
  tools:
    node: 26.5.0
    pnpm: 10.29.3

jobs:
  build_ios:
    name: Check and build iOS
    type: build
    params:
      platform: ios
      profile: production
    hooks:
      after_install_node_modules:
        - name: Check the mobile app
          run: pnpm run check

  # Uploads that exact build to App Store Connect. Team (Expo), with automatic
  # distribution, gets it once Apple processes it. Apple's upload event then
  # starts testflight-testers.yml, which hands it to the public link group.
  # Not a testflight job with build_id: Expo runs that only on paid plans.
  submit_ios:
    name: Upload to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
