name: Hexbot TestFlight

on:
  workflow_dispatch: {}

defaults:
  tools:
    node: 26.5.0
    pnpm: 10.29.3

jobs:
  build_ios:
    name: Check and build iOS
    type: build
    params:
      platform: ios
      profile: production
    hooks:
      after_install_node_modules:
        - name: Check the mobile app
          run: pnpm run check

  # Uploads the build. Team (Expo), with automatic distribution, gets it as
  # soon as Apple processes it. Website0 is the external group behind the
  # public link on hexbot.app; each build goes to Beta App Review for it.
  testflight:
    name: Upload to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      external_groups: [Website0]
      changelog: The latest Hexbot nightly. Pair it with your daemon and tell us what breaks.
