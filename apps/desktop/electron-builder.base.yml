# Settings shared by both packages. Do not build from this file directly;
# electron-builder.yml (full) and electron-builder.client.yml (client) extend it.
appId: app.hexbot.desktop
productName: Hexbot
artifactName: Hexbot-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  - resources/**
  - '!resources/hexbot-src/**'
  - package.json
asar: true
protocols:
  - name: Hexbot
    schemes:
      - hexbot
mac:
  # No arch here: release.yml picks one per job with --arm64 or --x64, and a
  # bare --mac builds the host architecture. A per-target arch list would
  # override those flags and every job would package both.
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # electron-builder notarizes only when APPLE_API_KEY, APPLE_API_KEY_ID,
  # and APPLE_API_ISSUER are all present in the release environment.
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  executableName: hexbot
  artifactName: Hexbot-${version}-linux-${arch}.${ext}
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libasound2
  desktop:
    entry:
      Categories: Utility
      StartupWMClass: Hexbot
publish:
  provider: generic
  url: https://updates.hexbot.app/full/${os}/${arch}
# Prerelease versions (0.1.5-alpha.1) would otherwise get an "alpha" feed name.
# The feed has two channels only, latest (stable) and nightly; the updater and
# scripts/desktop/make-update-feed.mjs pick the file (docs/channels.md).
detectUpdateChannel: false

afterPack: ../../scripts/desktop/after-pack.cjs
