appId: app.hexbot.desktop
productName: Hexbot
artifactName: Hexbot-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  - resources/**
  - package.json
asar: true
protocols:
  - name: Hexbot
    schemes:
      - hexbot
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # electron-builder notarizes only when APPLE_API_KEY, APPLE_API_KEY_ID,
  # and APPLE_API_ISSUER are all present in the release environment.
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  executableName: hexbot
publish:
  provider: generic
  url: https://hexbot.app/updates/${os}/${arch}
