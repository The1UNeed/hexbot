[package]
name = "hexbot-installer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "hexbot_installer"

[[bin]]
name = "hexbot-install"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
libc = "=0.2.190"
flate2 = "=1.1.10"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "=0.17.14"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = "=0.4.46"
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell"] }

# Reads installed AppImage versions without running them.
[target.'cfg(target_os = "linux")'.dependencies]
backhand = { version = "=0.25.5", default-features = false, features = ["gzip", "xz", "zstd"] }

[target.'cfg(unix)'.dev-dependencies]
# Builds AppImage fixtures on Unix hosts.
backhand = { version = "=0.25.5", default-features = false, features = ["gzip", "xz", "zstd"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
