[package]
name = "hexbot-installer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "hexbot_installer"

[[bin]]
name = "hexbot-install"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
libc = "=0.2.190"
flate2 = "=1.1.10"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "=0.17.14"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = "=0.4.46"
tempfile = "=3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
