[project]
name = "hexbot-handoff"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
all = []
dev = ["pytest==8.4.2"]

[project.scripts]
hexbot = "hexbot.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexbot"]
