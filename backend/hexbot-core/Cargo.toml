[package]
name = "hexbot-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
regex = "=1.13.1"
unicode-normalization = "=0.1.24"
qrcode = { version = "=0.14.1", default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
dotenvy = "=0.15.7"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time", "net", "signal"] }
axum = { version = "=0.8.9", features = ["ws"] }
tower-http = { version = "=0.6.11", features = ["fs"] }
futures-util = "=0.3.34"
uuid = { version = "=1.26.1", features = ["v4"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rand = "=0.8.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = "=2.5.8"
chrono = "=0.4.45"
jsonwebtoken = "=9.3.1"
tar = "=0.4.46"
flate2 = "=1.1.10"
tokio-tungstenite = { version = "=0.29.0", features = ["connect", "rustls-tls-webpki-roots"] }
yaml-edit = "=0.3.2"
jsonschema = { version = "=0.57.0", default-features = false }

[[bin]]
name = "hexbot"
path = "src/daemon.rs"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
