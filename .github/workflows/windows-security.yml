# The Windows execution boundary under a standard user: what Auto and Manual
# run in the AppContainer and what they refuse. This publishes nothing.
name: Windows security boundary

on:
  push:
    branches: ['**']
    paths:
      - 'backend/pi-runtime/**'
      - 'backend/hexbot-core/**'
      # Cargo/rustup discover these from the checkout cwd, not --manifest-path.
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
      - '.cargo/config.toml'
      - '.cargo/config'
      - 'scripts/dev/*windows-security*'
      - '.github/workflows/windows-security.yml'
  pull_request:
    paths:
      - 'backend/pi-runtime/**'
      - 'backend/hexbot-core/**'
      # Cargo/rustup discover these from the checkout cwd, not --manifest-path.
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
      - '.cargo/config.toml'
      - '.cargo/config'
      - 'scripts/dev/*windows-security*'
      - '.github/workflows/windows-security.yml'

permissions:
  contents: read

jobs:
  refusal:
    name: Native refusal under a standard Windows user
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
      - run: npm ci --prefix backend/pi-runtime --ignore-scripts --no-audit --no-fund
      - name: Exercise the real Pi extension without an administrator token
        shell: pwsh
        run: ./scripts/dev/windows-security-standard-user.ps1 -Runtime (Resolve-Path backend/pi-runtime).Path

  combined-refusal:
    name: Combined native Rust and Pi refusal under a standard user
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
      - run: rustup show active-toolchain
      - name: Compile the actual Rust runtime boundary probe and the daemon it runs as the sandbox helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $messages = Join-Path $env:RUNNER_TEMP 'hexbot-native-refusal-compiler.jsonl'
          cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test windows_security --no-run --message-format=json | Out-File -FilePath $messages -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Native Rust probe did not compile' }
          $artifacts = @(Get-Content $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable })
          $artifact = @($artifacts | Where-Object { $_.target.name -eq 'windows_security' })
          $daemon = @($artifacts | Where-Object { $_.target.name -eq 'hexbot' -and $_.target.kind -contains 'bin' })
          if ($artifact.Count -ne 1 -or $daemon.Count -ne 1) { throw 'Expected one native test executable and one daemon executable' }
          "HEXBOT_WINDOWS_PROBE=$($artifact[0].executable)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HEXBOT_WINDOWS_DAEMON=$($daemon[0].executable)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the pinned production Pi runtime
        run: npm ci --prefix backend/pi-runtime --ignore-scripts --no-audit --no-fund
      - name: Exercise production runtime gates as a standard local user
        shell: pwsh
        run: ./scripts/dev/windows-security-standard-user.ps1 -Runtime (Resolve-Path backend/pi-runtime).Path -Probe "$env:HEXBOT_WINDOWS_PROBE" -Hexbot "$env:HEXBOT_WINDOWS_DAEMON"
