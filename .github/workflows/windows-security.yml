# Refusal tests only. This does not enable or publish Windows packages.
name: Windows security boundary

on:
  push:
    branches: ['**']
    paths:
      - 'backend/pi-runtime/**'
      - 'backend/hexbot-core/src/credentials.rs'
      - 'backend/hexbot-core/src/windows_sandbox.rs'
      - 'backend/hexbot-core/src/runtime.rs'
      - 'backend/hexbot-core/src/dreaming.rs'
      - 'backend/hexbot-core/src/provider_acp.rs'
      - 'backend/hexbot-core/tests/windows_security.rs'
      - 'scripts/dev/*windows-security*'
      - '.github/workflows/windows-security.yml'
  pull_request:
    paths:
      - 'backend/pi-runtime/**'
      - 'backend/hexbot-core/src/credentials.rs'
      - 'backend/hexbot-core/src/windows_sandbox.rs'
      - 'backend/hexbot-core/src/runtime.rs'
      - 'backend/hexbot-core/src/dreaming.rs'
      - 'backend/hexbot-core/src/provider_acp.rs'
      - 'backend/hexbot-core/tests/windows_security.rs'
      - 'scripts/dev/*windows-security*'
      - '.github/workflows/windows-security.yml'

permissions:
  contents: read

jobs:
  refusal:
    name: Native refusal under a standard Windows user
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
      - run: npm ci --prefix backend/pi-runtime --ignore-scripts --no-audit --no-fund
      - name: Exercise the real Pi extension without an administrator token
        shell: pwsh
        run: ./scripts/dev/windows-security-standard-user.ps1 -Runtime (Resolve-Path backend/pi-runtime).Path

  combined-refusal:
    name: Combined native Rust and Pi refusal under a standard user
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
      - run: rustup show active-toolchain
      - name: Combine pinned sources and remove only the exact guard in a disposable copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HEXBOT_CI_GIT = (Get-Command git.exe).Source
          $root = Join-Path $env:RUNNER_TEMP 'hexbot-native-refusal-source'
          $routing = node scripts/dev/windows-security-inputs.mjs '${{ github.workspace }}' '${{ github.event.pull_request.head.sha || github.sha }}' 3b8aa2f8c3072e14fb1239dc301c0964ccaf525a
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select immutable native inputs' }
          $plan = $routing | ConvertFrom-Json
          $arguments = @($root, $plan.buildSHA, $plan.securitySHA)
          if ($plan.currentTree) { $arguments += '--current-tree' }
          $record = node scripts/dev/prepare-windows-security.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare exact combined source' }
          $inputs = $record | ConvertFrom-Json
          if ($inputs.sourceDir -ne $root -or $inputs.buildSHA -ne $plan.buildSHA -or $inputs.securitySHA -ne $plan.securitySHA) { throw 'Unexpected native source inputs' }
          if ($plan.currentTree -and ($inputs.appliedSecurityPatch -or $inputs.guardedTree -ne $plan.guardedTree)) { throw 'Current source tree was not preserved' }
          "HEXBOT_COMBINED_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The checkout used for production is still guarded and unchanged.
          git diff --exit-code -- backend/hexbot-core/src/lib.rs
          if ($LASTEXITCODE -ne 0) { throw 'Production platform guard changed' }
      - name: Compile the actual Rust runtime refusal probe, without other unit-test fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:HEXBOT_COMBINED_ROOT 'backend/hexbot-core/Cargo.toml'
          $messages = Join-Path $env:RUNNER_TEMP 'hexbot-native-refusal-compiler.jsonl'
          cargo test --locked --manifest-path $manifest --test windows_security --no-run --message-format=json | Out-File -FilePath $messages -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Combined native Rust probe did not compile' }
          $artifact = @(Get-Content $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'windows_security' -and $_.executable })
          if ($artifact.Count -ne 1) { throw 'Expected one native test executable' }
          "HEXBOT_WINDOWS_PROBE=$($artifact[0].executable)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the pinned production Pi runtime in the disposable source
        shell: pwsh
        run: npm ci --prefix "$env:HEXBOT_COMBINED_ROOT/backend/pi-runtime" --ignore-scripts --no-audit --no-fund
      - name: Exercise production runtime gates as a standard local user
        shell: pwsh
        run: ./scripts/dev/windows-security-standard-user.ps1 -Runtime "$env:HEXBOT_COMBINED_ROOT/backend/pi-runtime" -Probe "$env:HEXBOT_WINDOWS_PROBE"
      - name: Remove the disposable source and all generated test executables
        if: always()
        shell: pwsh
        run: |
          if ($env:HEXBOT_COMBINED_ROOT -and (Test-Path $env:HEXBOT_COMBINED_ROOT)) {
            git worktree remove --force $env:HEXBOT_COMBINED_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Cannot remove disposable source' }
          }
