name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv venv --python 3.11
      - run: uv sync --extra all --locked
        env:
          UV_PROJECT_ENVIRONMENT: venv
      - run: ./venv/bin/pytest tests/hexbot -q

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm approve-scripts electron esbuild @tailwindcss/oxide
      - run: npm run typecheck -w apps/web
      - run: npm run test -w apps/web -- --run
      - run: npm run lint -w apps/web
      - run: npm run build -w apps/web
      - run: npm run typecheck -w apps/desktop
      - run: npm run test -w apps/desktop -- --run
      - run: npm run build -w apps/desktop

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        edition: [full, client]
        build: [mac-arm64, mac-x64, linux-x64]
        include:
          - build: mac-arm64
            runner: macos-14
            target: --mac
            arch: --arm64
          - build: mac-x64
            runner: macos-14
            target: --mac
            arch: --x64
          - build: linux-x64
            runner: ubuntu-22.04
            target: --linux
            arch: --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm approve-scripts electron esbuild @tailwindcss/oxide
      - run: npm run build -w apps/web
      - run: node scripts/desktop/stage-python-src.mjs
        if: matrix.edition == 'full'
      - run: npx electron-vite build
        working-directory: apps/desktop
        env:
          HEXBOT_EDITION: ${{ matrix.edition }}
      - run: npx electron-builder ${{ matrix.target }} ${{ matrix.arch }} ${{ matrix.edition == 'client' && '--config electron-builder.client.yml' || '' }} --publish never
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.edition }}-${{ matrix.build }}
          path: apps/desktop/release/**
          if-no-files-found: error
