# Tests and builds on every push and pull request. Publishes nothing.
# release.yml calls this workflow before it builds packages, so a release
# runs the same checks as a pull request (docs/channels.md, docs/testing.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

# One run per pull request or pushed commit. A newer push to the same pull
# request cancels the older run; pushes to a branch and release checks never
# cancel each other.
concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-components:
    name: Rust daemon and Pi integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/hexbot-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend/hexbot-core
      # The daemon and the Pi extension sandbox shell commands with bubblewrap
      # on Linux, and both suites branch on whether it works. Ubuntu 24.04
      # confines unprivileged user namespaces with AppArmor and the apt package
      # ships no profile, so a fresh install fails the daemon's probe; this is
      # the profile the install docs give users. The final probe is the
      # daemon's own, so a sandbox that cannot start fails here, not as a
      # skipped test.
      - name: Install bubblewrap, the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          probe() { bwrap --die-with-parent --unshare-pid --ro-bind / / --proc /proc -- /usr/bin/env true; }
          if ! probe 2>/dev/null; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/bwrap
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          probe
      - run: cargo fmt --check
      - run: cargo test --locked --no-fail-fast
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify real Pi sessions and native tools
        run: |
          npm ci --prefix ../pi-runtime --ignore-scripts --no-audit --no-fund
          node --test ../pi-runtime/*.test.mjs
          HEXBOT_TEST_PI="$GITHUB_WORKSPACE/backend/pi-runtime/node_modules/.bin/pi" cargo test --locked --test pi_live -- --ignored
          HEXBOT_TEST_PI="$GITHUB_WORKSPACE/backend/pi-runtime/node_modules/.bin/pi" cargo test --locked --test runtime -- --ignored
          HEXBOT_TEST_PI="$GITHUB_WORKSPACE/backend/pi-runtime/node_modules/.bin/pi" cargo test --locked --test runtime_recovery -- --ignored

  rust-installer:
    name: Rust installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            backend/hexbot-installer
            apps/installer/src-tauri
      - run: cargo test --locked --manifest-path backend/hexbot-installer/Cargo.toml
      - run: cargo clippy --locked --manifest-path backend/hexbot-installer/Cargo.toml --all-targets -- -D warnings
      # The windowed installer (apps/installer) drives the same engine through Tauri.
      - name: Install the windowed installer's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --locked --manifest-path apps/installer/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/installer/src-tauri/Cargo.toml --all-targets -- -D warnings

  install-shell:
    name: POSIX installer bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck --shell=sh apps/site/public/install.sh
      - run: sh -n apps/site/public/install.sh

  native-ui:
    name: Browser and Electron against Rust and Pi
    # xvfb and Playwright's system packages are Linux only.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend/hexbot-core
      - run: cargo build --locked --manifest-path backend/hexbot-core/Cargo.toml --bin hexbot
      - run: npm ci --prefix backend/pi-runtime --ignore-scripts --no-audit --no-fund
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web run build
      - run: pnpm --filter ./apps/desktop exec playwright install --with-deps chromium
      - name: Unchanged browser app against Rust and Pi
        run: node scripts/dev/native-ui-smoke.mjs
      - name: Electron full edition against Rust and Pi
        run: xvfb-run -a node scripts/dev/native-ui-smoke.mjs --desktop --edition=full
      - name: Electron client-only edition against Rust and Pi
        run: xvfb-run -a node scripts/dev/native-ui-smoke.mjs --desktop --edition=client

  python-handoff:
    name: Python service handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/python-handoff
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv sync --extra dev --locked
      - run: .venv/bin/pytest tests -q

  web:
    name: Web and desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web run typecheck
      - run: pnpm --filter ./apps/web run test --run
      - run: pnpm --filter ./apps/web run lint
      - run: pnpm --filter ./apps/web run build
      - run: pnpm --filter ./apps/desktop run typecheck
      - run: pnpm --filter ./apps/desktop run test --run
      - name: Windowed installer checks
        if: hashFiles('apps/installer/package.json') != ''
        run: pnpm --filter ./apps/installer run typecheck && pnpm --filter ./apps/installer run test --run && pnpm --filter ./apps/installer run lint && pnpm --filter ./apps/installer run build
      - name: Prepare the native desktop compiler
        run: |
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend/hexbot-core
      - run: pnpm --filter ./apps/desktop run build
      - name: Verify sessions through the staged Pi runtime
        run: HEXBOT_TEST_PI="$GITHUB_WORKSPACE/apps/desktop/resources/hexbot-native/pi/hexbot-pi" cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test runtime -- --ignored
      - name: Install the native desktop runtime in isolated state
        run: HEXBOT_NATIVE_TEST_BUNDLE="$GITHUB_WORKSPACE/apps/desktop/resources/hexbot-native" pnpm --filter ./apps/desktop run test --run src/main/backend/native-bootstrap.test.ts
      # The search-tool tests launch the repository's pinned Pi.
      - run: npm ci --prefix backend/pi-runtime --ignore-scripts --no-audit --no-fund
      - name: Release script tests
        run: node --test scripts/desktop/*.test.mjs scripts/dev/*.test.mjs
      # Runs the exact commands release.yml runs after a build (version
      # resolution, update feed, website manifest, casks) against synthetic
      # packages, so a broken release script fails here and not on tag day.
      - name: Release smoke
        run: node scripts/desktop/release-smoke.mjs

  mobile:
    name: Mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/mobile run typecheck
      - run: pnpm --filter ./apps/mobile run test
      - name: Export iOS and Android bundles
        run: |
          pnpm --filter ./apps/mobile exec expo export --platform ios --output-dir dist/ios
          pnpm --filter ./apps/mobile exec expo export --platform android --output-dir dist/android

  services:
    name: Site and Connect
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/site run check
      - run: pnpm --filter ./apps/connect run typecheck
      - run: pnpm --filter ./apps/connect run test --run
      - run: pnpm --filter ./apps/connect run lint
