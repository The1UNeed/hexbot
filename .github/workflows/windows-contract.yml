# Development validation only. No release dependency, signing secrets or publishing.
name: Windows build and install contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  client-and-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.5.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: cargo check --locked --manifest-path backend/hexbot-installer/Cargo.toml
      - run: cargo clippy --locked --manifest-path backend/hexbot-installer/Cargo.toml --lib --bins -- -D warnings
      - run: cargo test --locked --manifest-path backend/hexbot-installer/Cargo.toml --test windows_repair
      - run: cargo clippy --locked --manifest-path apps/installer/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/installer/src-tauri/Cargo.toml
      - run: pnpm --filter ./apps/desktop run typecheck
      - name: Provision isolated Corepack for the real pnpm launcher contract
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'hexbot-corepack-probe'
          npm install --prefix $root --ignore-scripts --no-audit --no-fund corepack@0.36.0
          if ($LASTEXITCODE -ne 0) { throw 'Corepack provisioning failed' }
          $lock = Get-Content (Join-Path $root 'package-lock.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $integrity = $lock.packages.'node_modules/corepack'.integrity
          if ($integrity -cne 'sha512-SiiJsBhZqdBiPHTEl6OT3sASrRrKIcYTQMsVGXx6EE/gM8WFMwYjeIX8Tt8RiU4Iv2J6LbT8KpGfCOsBpRWB/w==') { throw 'Unexpected Corepack package integrity' }
          "HEXBOT_TEST_COREPACK_ROOT=$root" >> $env:GITHUB_ENV
      - run: node --test scripts/desktop/pnpm-command.test.mjs scripts/desktop/windows-task-stop.test.mjs scripts/desktop/voice-lock.test.mjs scripts/desktop/windows-contract.test.mjs scripts/desktop/windows-node-path.test.mjs scripts/desktop/native-build.test.mjs scripts/desktop/native-runtime.test.mjs scripts/desktop/workspace-hooks.test.mjs scripts/dev/run-one-rust-test.test.mjs
      - name: Build the real client NSIS without publishing
        run: node scripts/desktop/dist.mjs --win --x64 --client --channel stable
      - name: Verify installer engine runs NSIS, repairs and uninstalls the client
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Encoding UTF8 -Raw | ConvertFrom-Json).version
          $env:HEXBOT_WINDOWS_NSIS = (Resolve-Path "apps/desktop/release/HexbotClient-$version-win-x64.exe").Path
          $lookup = (Get-Command node -CommandType Application).Source
          $lookupValues = @($lookup)
          $lookupText = [string]$lookup
          Write-Host ('Node lookup diagnostic: ' + (@{ type=$(if ($null -eq $lookup) { 'null' } else { $lookup.GetType().FullName }); count=$lookupValues.Count; environmentSpelling=$lookupText.Substring(0, [Math]::Min(1024, $lookupText.Length)); paths=@($lookupValues | Select-Object -First 4 | ForEach-Object { $text=[string]$_; $text.Substring(0, [Math]::Min(512, $text.Length)) }) } | ConvertTo-Json -Compress))
          $env:HEXBOT_WINDOWS_GUI_PROBE = (Resolve-Path scripts/desktop/windows-installed-app-smoke.mjs).Path
          node scripts/dev/run-one-rust-test.mjs backend/hexbot-installer/Cargo.toml windows_contract real_nsis_install_repair_and_uninstall
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-client-contract
          path: apps/desktop/release/HexbotClient-*-win-x64.exe
          retention-days: 3
  native-runtime:
    env:
      HEXBOT_CLI_NO_PATH: '1'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.5.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - name: Native daemon compile gate expects only the production support guard
        run: node scripts/dev/check-windows-unsupported.mjs "${{ github.workspace }}"
      - name: Prepare the explicitly combined disposable native probe
        shell: pwsh
        env:
          HEXBOT_CI_GIT: C:\Program Files\Git\cmd\git.exe
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'hexbot-windows-contract-probe'
          $metadata = node scripts/dev/prepare-windows-security.mjs $source '${{ github.sha }}' '${{ github.sha }}' --current-tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $metadata
          $probe = $metadata | ConvertFrom-Json
          $tree = git rev-parse '${{ github.sha }}^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve immutable source tree' }
          if ($probe.sourceDir -ne $source -or $probe.buildSHA -ne '${{ github.sha }}' -or $probe.securitySHA -ne '${{ github.sha }}' -or $probe.appliedSecurityPatch -or $probe.guardedTree -ne $tree) { throw 'Disposable source does not preserve exact current tree' }
          "HEXBOT_WINDOWS_PROBE_SOURCE=$($probe.sourceDir)" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
      - name: Check the disposable native daemon and real launcher regressions
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        run: cargo clippy --locked --manifest-path backend/hexbot-core/Cargo.toml --lib --bins -- -D warnings
      - name: Run native Unicode, junction, service logs and security regressions
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        run: cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test task_readiness --test windows_launchers --test windows_contract --test windows_shutdown -- --nocapture
      - name: Verify the actual PowerShell stop controller before real task recovery
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        run: node --test scripts/desktop/windows-task-stop.test.mjs
      - name: Recover an interrupted owned task install without claiming foreign files
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        env:
          HEXBOT_WINDOWS_SERVICE_PROBE: '1'
        shell: pwsh
        run: |
          npm ci --prefix backend/pi-runtime --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path backend/hexbot-installer/Cargo.toml --bin hexbot-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HEXBOT_WINDOWS_INSTALLER = (Resolve-Path backend/hexbot-installer/target/debug/hexbot-install.exe).Path
          node scripts/dev/run-one-rust-test.mjs backend/hexbot-core/Cargo.toml windows_launchers interrupted_task_install_uninstalls_owned_files_when_the_task_is_absent
      - name: Validate per-user CLI PATH registration on the disposable CI user
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        env:
          HEXBOT_CLI_NO_PATH: '0'
          HEXBOT_WINDOWS_PATH_PROBE: '1'
        run: node scripts/dev/run-one-rust-test.mjs backend/hexbot-core/Cargo.toml windows_launchers user_path_registration_preserves_existing_entries_and_removes_only_its_own
      - name: Recover interrupted CLI metadata and PATH through the installer engine
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        env:
          HEXBOT_CLI_NO_PATH: '0'
          HEXBOT_WINDOWS_PATH_PROBE: '1'
        run: node scripts/dev/run-one-rust-test.mjs backend/hexbot-installer/Cargo.toml windows_contract interrupted_cli_install_and_uninstall_clean_only_owned_metadata_and_path
      - name: Build Full and its real Node/Pi runtime without publishing
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        run: node scripts/desktop/dist.mjs --win --x64 --channel stable
      - name: Probe Full bootstrap and standalone setup with real Node and Pi
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        shell: pwsh
        run: |
          $env:HEXBOT_NATIVE_TEST_BUNDLE = (Resolve-Path apps/desktop/resources/hexbot-native).Path
          pnpm --filter ./apps/desktop run test --run src/main/backend/windows-bootstrap.test.ts src/main/backend/windows-readiness.test.ts src/main/backend/windows-paths.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/dev/run-one-rust-test.mjs backend/hexbot-core/Cargo.toml windows_pi real_pi_process_uses_absolute_node_launcher_and_windows_environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/dev/run-one-rust-test.mjs backend/hexbot-core/Cargo.toml windows_pi stopping_one_pi_reaps_its_real_bash_tree_and_preserves_another_pi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/dev/run-one-rust-test.mjs backend/hexbot-core/Cargo.toml windows_shutdown owned_desktop_pipe_quit_and_restart_clean_up_real_pi_and_home_lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/desktop/runtime-file.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/desktop/windows-runtime-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/desktop/windows-update-restart.mjs
      - name: Probe Full NSIS installation, repair and uninstall
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Encoding UTF8 -Raw | ConvertFrom-Json).version
          $env:HEXBOT_WINDOWS_NSIS = (Resolve-Path "apps/desktop/release/Hexbot-$version-win-x64.exe").Path
          $env:HEXBOT_WINDOWS_EDITION = 'full'
          $lookup = (Get-Command node -CommandType Application).Source
          $lookupValues = @($lookup)
          $lookupText = [string]$lookup
          Write-Host ('Node lookup diagnostic: ' + (@{ type=$(if ($null -eq $lookup) { 'null' } else { $lookup.GetType().FullName }); count=$lookupValues.Count; environmentSpelling=$lookupText.Substring(0, [Math]::Min(1024, $lookupText.Length)); paths=@($lookupValues | Select-Object -First 4 | ForEach-Object { $text=[string]$_; $text.Substring(0, [Math]::Min(512, $text.Length)) }) } | ConvertTo-Json -Compress))
          $env:HEXBOT_WINDOWS_GUI_PROBE = (Resolve-Path scripts/desktop/windows-installed-app-smoke.mjs).Path
          node scripts/dev/run-one-rust-test.mjs backend/hexbot-installer/Cargo.toml windows_contract real_nsis_install_repair_and_uninstall
      - name: Probe signed Headless ZIP update and pinned Connect executable
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        shell: pwsh
        run: |
          node scripts/desktop/make-native-update.mjs apps/desktop/resources/hexbot-native windows-updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HEXBOT_WINDOWS_UPDATE_ROOT = (Resolve-Path windows-updates).Path
          node scripts/dev/run-one-rust-test.mjs backend/hexbot-core/Cargo.toml windows_contract signed_zip_update_and_connect_executable
      - name: Run the combined native Runtime refusal regression under a standard user
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        shell: pwsh
        run: |
          npm ci --prefix backend/pi-runtime --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Cannot provision refusal runtime' }
          $messages = Join-Path $env:RUNNER_TEMP 'hexbot-contract-refusal-compiler.jsonl'
          cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test windows_security --no-run --message-format=json | Out-File -FilePath $messages -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Native refusal probe did not compile' }
          $artifact = @(Get-Content $messages -Encoding UTF8 | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'windows_security' -and $_.executable })
          if ($artifact.Count -ne 1) { throw 'Expected exactly one native refusal executable' }
          ./scripts/dev/windows-security-standard-user.ps1 -Runtime (Resolve-Path backend/pi-runtime).Path -Probe $artifact[0].executable
      # Disposable guard-removed binaries are never uploaded or published.
