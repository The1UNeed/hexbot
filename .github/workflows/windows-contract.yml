# Development validation only. No release dependency, signing secrets or publishing.
name: Windows build and install contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  client-and-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.5.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: cargo check --locked --manifest-path backend/hexbot-installer/Cargo.toml
      - run: cargo clippy --locked --manifest-path backend/hexbot-installer/Cargo.toml --lib --bins -- -D warnings
      - run: cargo check --locked --manifest-path apps/installer/src-tauri/Cargo.toml
      - run: pnpm --filter ./apps/desktop run typecheck
      - run: node --test scripts/desktop/windows-contract.test.mjs scripts/desktop/native-build.test.mjs
      - name: Build the real client NSIS without publishing
        run: node scripts/desktop/dist.mjs --win --x64 --client --channel stable
      - name: Verify installer engine runs NSIS, repairs and uninstalls the client
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Encoding UTF8 -Raw | ConvertFrom-Json).version
          $env:HEXBOT_WINDOWS_NSIS = (Resolve-Path "apps/desktop/release/HexbotClient-$version-win-x64.exe").Path
          $env:HEXBOT_WINDOWS_GUI_NODE = (Get-Command node -CommandType Application).Source
          $env:HEXBOT_WINDOWS_GUI_PROBE = (Resolve-Path scripts/desktop/windows-installed-app-smoke.mjs).Path
          cargo test --locked --manifest-path backend/hexbot-installer/Cargo.toml --test windows_contract -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-client-contract
          path: apps/desktop/release/HexbotClient-*-win-x64.exe
          retention-days: 3
  native-runtime:
    env:
      HEXBOT_CLI_NO_PATH: '1'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.5.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - name: Native daemon compile gate expects only the production support guard
        run: node scripts/dev/check-windows-unsupported.mjs "${{ github.workspace }}"
      - name: Prepare the explicitly combined disposable native probe
        shell: pwsh
        env:
          HEXBOT_CI_GIT: C:\Program Files\Git\cmd\git.exe
          HEXBOT_WINDOWS_SECURITY_SHA: cbf99ccb90e44c6054cd40a30bed18403cc0164a
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'hexbot-windows-contract-probe'
          $metadata = node scripts/dev/prepare-windows-security.mjs $source '${{ github.sha }}' $env:HEXBOT_WINDOWS_SECURITY_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $metadata
          $probe = $metadata | ConvertFrom-Json
          if ($probe.sourceDir -ne $source) { throw 'Unexpected disposable source directory' }
          "HEXBOT_WINDOWS_PROBE_SOURCE=$($probe.sourceDir)" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
      - name: Check the disposable native daemon and real launcher regressions
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        run: cargo clippy --locked --manifest-path backend/hexbot-core/Cargo.toml --lib --bins -- -D warnings
      - name: Run native Unicode, junction, service logs and security regressions
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        run: cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test windows_launchers --test windows_contract -- --nocapture
      - name: Validate per-user CLI PATH registration on the disposable CI user
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        env:
          HEXBOT_CLI_NO_PATH: '0'
          HEXBOT_WINDOWS_PATH_PROBE: '1'
        run: cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test windows_launchers user_path_registration -- --ignored --nocapture
      - name: Build Full and its real Node/Pi runtime without publishing
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        run: node scripts/desktop/dist.mjs --win --x64 --channel stable
      - name: Probe Full bootstrap and standalone setup with real Node and Pi
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        shell: pwsh
        run: |
          $env:HEXBOT_NATIVE_TEST_BUNDLE = (Resolve-Path apps/desktop/resources/hexbot-native).Path
          pnpm --filter ./apps/desktop run test --run src/main/backend/windows-bootstrap.test.ts src/main/backend/windows-paths.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test windows_pi -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/desktop/windows-runtime-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/desktop/windows-update-restart.mjs
      - name: Probe Full NSIS installation, repair and uninstall
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Encoding UTF8 -Raw | ConvertFrom-Json).version
          $env:HEXBOT_WINDOWS_NSIS = (Resolve-Path "apps/desktop/release/Hexbot-$version-win-x64.exe").Path
          $env:HEXBOT_WINDOWS_EDITION = 'full'
          $env:HEXBOT_WINDOWS_GUI_NODE = (Get-Command node -CommandType Application).Source
          $env:HEXBOT_WINDOWS_GUI_PROBE = (Resolve-Path scripts/desktop/windows-installed-app-smoke.mjs).Path
          cargo test --locked --manifest-path backend/hexbot-installer/Cargo.toml --test windows_contract -- --ignored --nocapture
      - name: Probe signed Headless ZIP update and pinned Connect executable
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        shell: pwsh
        run: |
          node scripts/desktop/make-native-update.mjs apps/desktop/resources/hexbot-native windows-updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HEXBOT_WINDOWS_UPDATE_ROOT = (Resolve-Path windows-updates).Path
          cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test windows_contract -- --ignored --nocapture
      - name: Run the combined native Runtime refusal regression
        working-directory: ${{ env.HEXBOT_WINDOWS_PROBE_SOURCE }}
        run: cargo test --locked --manifest-path backend/hexbot-core/Cargo.toml --test windows_security -- --nocapture
      # Disposable guard-removed binaries are never uploaded or published.
