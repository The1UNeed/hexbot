# Stable and nightly releases from one workflow, modelled on T3 Code's
# release.yml (docs/channels.md, docs/release.md).
#
#   stable   push a v<version> tag that matches apps/desktop/package.json, or
#            dispatch by hand on main with channel `stable`; the run then
#            creates the tag for the version in package.json.
#            Plain X.Y.Z is the repository's "latest" release; a suffix such as
#            -alpha.1 makes a GitHub prerelease. The finalize job then commits
#            the website downloads manifest and the Homebrew casks to main.
#   nightly  09:00 UTC daily, or dispatch by hand. Skipped when main has not
#            moved since the last nightly. Version <base>-nightly.<date>.<run>.
#            Always a prerelease; the last 14 are kept.
#
# Both channels: six packages (full and client, for macOS arm64, macOS x64,
# Linux x64) plus native daemon archives and installers, the update feed on
# updates.hexbot.app when the R2 secrets are present, and a GitHub release
# with every package. Signing and notarization
# happen when the Apple secrets are present and are skipped otherwise.
#
# Secrets (all optional; docs/release.md, "One-time setup"):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   update server
#   CSC_LINK, CSC_KEY_PASSWORD                              Developer ID signing
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER       notarization
#   SITE_DEPLOY_HOOK_URL                                    redeploy hexbot.app
# Variables (optional): R2_UPDATES_BUCKET (default hexbot-updates),
#   HEXBOT_CRASH_URL (crash report endpoint baked into the app).
name: Release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [nightly, stable]
        default: nightly

# Jobs that publish ask for more below.
permissions:
  contents: read

# One publisher per channel at a time. A queued run waits; it never cancels a
# running one, so a half-published release cannot happen.
concurrency:
  group: release-${{ (startsWith(github.ref, 'refs/tags/v') || inputs.channel == 'stable') && 'stable' || 'nightly' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      latest: ${{ steps.resolve.outputs.latest }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: resolve
        name: Resolve the channel and version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* || "$INPUT_CHANNEL" == stable ]]; then
            channel=stable
            # Release notes compare against the previous stable release.
            previous=$(gh release list --limit 200 --json tagName,isPrerelease,isDraft \
              -q '[.[] | select(.isDraft | not) | select(.tagName | test("-nightly\\.") | not) | .tagName][0] // empty')
          else
            channel=nightly
            previous=$(gh release list --limit 200 --json tagName,isDraft \
              -q '[.[] | select(.isDraft | not) | select(.tagName | test("-nightly\\."))][0].tagName // empty')
            # A scheduled nightly needs new commits since the last one. A
            # manual dispatch always builds. The compare API works even when
            # the last nightly's tag has since been pruned from the clone.
            if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -n "$previous" ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq .status || echo unknown)
              if [ "$status" != ahead ]; then
                echo "main is '$status' relative to $previous; nothing to build"
                echo "build=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"
          node scripts/desktop/release-version.mjs --channel "$channel" | tee release.env
          cat release.env >> "$GITHUB_OUTPUT"
          # A manual stable run creates its own tag, so the version must be new.
          tag=$(sed -n 's/^tag=//p' release.env)
          if [[ "$channel" == stable && "$GITHUB_REF" != refs/tags/* ]] &&
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists. Set the next version with scripts/desktop/set-version.mjs and commit it first."
            exit 1
          fi

  check:
    name: Check
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.edition }} ${{ matrix.build }}
    needs: [preflight, check]
    if: needs.preflight.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        edition: [full, client]
        build: [mac-arm64, mac-x64, linux-x64]
        include:
          # macOS 26 runners carry Xcode 26, whose actool compiles the layered
          # Icon Composer icon (scripts/desktop/dist.mjs). Both architectures
          # build on the arm64 image; electron-builder cross-packages x64.
          - build: mac-arm64
            runner: macos-26
            target: --mac --arm64
          - build: mac-x64
            runner: macos-26
            target: --mac --x64
          # The oldest supported Ubuntu keeps the AppImage's glibc floor low.
          - build: linux-x64
            runner: ubuntu-22.04
            target: --linux --x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the native compiler
        if: matrix.edition == 'full'
        run: |
          rustup show active-toolchain
          if [ "${{ matrix.build }}" = mac-x64 ]; then rustup target add x86_64-apple-darwin; fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: matrix.edition == 'full'
        with:
          workspaces: backend/hexbot-core
          key: ${{ matrix.build }}
      - name: Set the release version
        run: node scripts/desktop/set-version.mjs "$VERSION"
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "No Developer ID certificate; the app will be ad-hoc signed (scripts/desktop/after-pack.cjs)."
            exit 0
          fi
          {
            echo "CSC_LINK=$CSC_LINK"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Developer ID signing enabled."
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "Apple API key incomplete; notarization skipped."
            exit 0
          fi
          # electron-builder wants APPLE_API_KEY as a path to the .p8 file,
          # while the secret holds its contents (docs/release.md).
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
          echo "Notarization enabled."
      - name: Build the package
        env:
          HEXBOT_CRASH_URL: ${{ vars.HEXBOT_CRASH_URL }}
        run: node scripts/desktop/dist.mjs ${{ matrix.target }} --channel "$CHANNEL" ${{ matrix.edition == 'client' && '--client' || '' }}
      - name: Verify packaged macOS signatures and launch
        if: runner.os == 'macOS'
        env:
          HEXBOT_PACKAGED_TEST_EDITION: ${{ matrix.edition }}
        run: HEXBOT_PACKAGED_TEST_DIR="$GITHUB_WORKSPACE/apps/desktop/release" node --test scripts/desktop/runtime-signing.test.mjs
      - name: List the output
        run: ls -l apps/desktop/release
      # The minimal backend/python-handoff package for existing Python services
      # following the source feed. It installs the native daemon. Clients request
      # their own version, so every release publishes one.
      # This compatibility source archive is platform-independent.
      - name: Archive the daemon source
        if: matrix.edition == 'full' && matrix.build == 'linux-x64'
        run: |
          node scripts/desktop/stage-python-src.mjs --native-transition
          tar -czf "hexbot-src-$VERSION.tar.gz" -C apps/desktop/resources hexbot-src
      - uses: actions/upload-artifact@v7
        if: matrix.edition == 'full' && matrix.build == 'linux-x64'
        with:
          name: daemon-src
          path: hexbot-src-*.tar.gz
          if-no-files-found: error
      - name: Archive the native daemon
        if: matrix.edition == 'full'
        run: |
          set -euo pipefail
          bundle=apps/desktop/resources/hexbot-native
          if [ "$RUNNER_OS" = macOS ]; then
            # Packaging signs the runtime inside the app, not the staged copy.
            bundles=(apps/desktop/release/mac*/*.app/Contents/Resources/hexbot-native)
            [ "${#bundles[@]}" -eq 1 ]
            [ -d "${bundles[0]}" ]
            bundle="${bundles[0]}"
          fi
          node scripts/desktop/make-native-update.mjs "$bundle" native-updates
      - uses: actions/upload-artifact@v7
        if: matrix.edition == 'full'
        with:
          name: daemon-native-${{ matrix.build }}
          path: native-updates/daemon/native/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.edition }}-${{ matrix.build }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  installer:
    name: Build installer ${{ matrix.build }}
    needs: [preflight, check]
    if: needs.preflight.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: mac-arm64
            runner: macos-26
            rust-target: aarch64-apple-darwin
            target: macos-aarch64
            app-suffix: mac-arm64.dmg
            bundles: dmg
          - build: mac-x64
            runner: macos-26
            rust-target: x86_64-apple-darwin
            target: macos-x86_64
            app-suffix: mac-x64.dmg
            bundles: dmg
          - build: linux-x64
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            target: linux-x86_64
            app-suffix: linux-x86_64.AppImage
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the native compiler
        run: |
          rustup show active-toolchain
          rustup target add '${{ matrix.rust-target }}'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend/hexbot-installer
          key: installer-${{ matrix.build }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: hashFiles('apps/installer/package.json') != ''
        with:
          workspaces: apps/installer/src-tauri
          key: installer-app-${{ matrix.build }}
      - name: Install Linux windowed installer dependencies
        if: runner.os == 'Linux' && hashFiles('apps/installer/package.json') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Set the release version
        run: node scripts/desktop/set-version.mjs "$VERSION"
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo '::notice::No Developer ID certificate or password; installers will be ad-hoc signed.'
            exit 0
          fi
          certificate="$RUNNER_TEMP/installer-certificate.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate"
          keychain="$RUNNER_TEMP/installer-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then echo '::error::No Developer ID Application identity in CSC_LINK'; exit 1; fi
          certificate_base64=$(base64 < "$certificate" | tr -d '\r\n')
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_CERTIFICATE=$certificate_base64"
            echo "APPLE_CERTIFICATE_PASSWORD=$CSC_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          rm "$certificate"
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo 'Apple API key incomplete; notarization skipped.'
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          # Tauri uses the key ID as APPLE_API_KEY, unlike electron-builder.
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_KEY_PATH=$key_path"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Build the CLI installer
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path backend/hexbot-installer/Cargo.toml --target '${{ matrix.rust-target }}'
          mkdir -p installer-artifacts
          cp 'backend/hexbot-installer/target/${{ matrix.rust-target }}/release/hexbot-install' "installer-artifacts/hexbot-install-$VERSION-${{ matrix.target }}"
      - name: Sign and notarize the macOS CLI installer
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          binary="installer-artifacts/hexbot-install-$VERSION-${{ matrix.target }}"
          if [ "$APPLE_SIGNING_IDENTITY" = '-' ]; then
            codesign --force --sign - "$binary"
          else
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$binary"
          fi
          codesign --verify --strict --verbose=2 "$binary"
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/installer-notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/installer-notarize.zip" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/installer-notarize.json"
            node -e 'const fs=require("fs"); const result=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/installer-notarize.json`)); if(result.status!=="Accepted") throw Error(`Installer notarization ${result.status}`)'
          fi
      - name: Build the windowed installer
        if: hashFiles('apps/installer/package.json') != ''
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          # Override Tauri's version without editing the app's source files.
          pnpm --filter ./apps/installer run tauri build --target '${{ matrix.rust-target }}' --bundles '${{ matrix.bundles }}' --config "{\"version\":\"$VERSION\"}"
          extension='${{ matrix.app-suffix }}'
          extension="${extension##*.}"
          shopt -s nullglob
          bundles=(apps/installer/src-tauri/target/${{ matrix.rust-target }}/release/bundle/${{ matrix.bundles }}/*."$extension")
          if [ "${#bundles[@]}" -ne 1 ]; then echo '::error::Expected exactly one windowed installer bundle'; exit 1; fi
          cp "${bundles[0]}" "installer-artifacts/HexbotInstaller-$VERSION-${{ matrix.app-suffix }}"
      - name: Clean up macOS signing
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/installer-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/installer-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/installer-notarize.zip" "$RUNNER_TEMP/installer-notarize.json" "$RUNNER_TEMP/installer-certificate.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.build }}
          path: installer-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.preflight.outputs.channel }} ${{ needs.preflight.outputs.version }}
    needs: [preflight, build, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      # Step-level `if` cannot read secrets; the job env can.
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ACCOUNT_ID != '' }}
      R2_BUCKET: ${{ vars.R2_UPDATES_BUCKET || 'hexbot-updates' }}
      HAS_SITE_HOOK: ${{ secrets.SITE_DEPLOY_HOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect the packages
        run: |
          set -euo pipefail
          mkdir -p release/full release/client release/daemon release/install "dist/updates/install/$VERSION"
          cp artifacts/full-*/* release/full/
          cp artifacts/client-*/* release/client/
          mkdir -p dist/updates/daemon/native
          for native in artifacts/daemon-native-*; do
            cp -R "$native"/* dist/updates/daemon/native/
            find "$native" -name '*.tar.gz' -exec cp {} release/daemon/ \;
          done
          cp artifacts/daemon-src/*.tar.gz release/daemon/
          cp artifacts/installer-*/* release/install/
          cp release/install/* "dist/updates/install/$VERSION/"
          ls -l release/full release/client release/daemon release/install
      - name: Build the update feed
        run: |
          set -euo pipefail
          node scripts/desktop/make-update-feed.mjs --channel "$CHANNEL" --version "$VERSION" release/full
          node scripts/desktop/make-update-feed.mjs --channel "$CHANNEL" --version "$VERSION" --client release/client
          mkdir -p dist/updates/daemon
          cp "release/daemon/hexbot-src-$VERSION.tar.gz" dist/updates/daemon/
          # Before the windowed app lands, only installerApp may be absent.
          missing=()
          if [ ! -f apps/installer/package.json ]; then missing=(--allow-missing); fi
          node scripts/desktop/make-install-manifest.mjs --channel "$CHANNEL" --version "$VERSION" dist/updates "${missing[@]}"
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(`dist/updates/install/${process.env.CHANNEL}.json`)); for(const target of ["macos-aarch64","macos-x86_64","linux-x86_64"]) for(const option of ["full","client","headless","installer"]) if(!m.targets[target]?.[option]) throw Error(`Missing ${target}/${option}`)'
          find dist/updates -type f | sort
      # Daemons, installers, and the Python handoff install nothing without these
      # signatures. The step checks each one against packaging/update-signing-key.pub.
      - name: Sign the update manifests
        env:
          HEXBOT_UPDATE_SIGNING_KEY: ${{ secrets.HEXBOT_UPDATE_SIGNING_KEY }}
        run: node scripts/desktop/update-signing.mjs sign dist/updates --channel "$CHANNEL" --version "$VERSION"
      - name: Publish the update feed to updates.hexbot.app
        if: env.HAS_R2 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Packages first (their names carry the version, so they never
          # change once uploaded), then the feed files that point at them.
          aws s3 sync dist/updates "s3://$R2_BUCKET/" --exclude '*.yml' --exclude 'install/stable.json' --exclude 'install/stable.txt' --exclude 'install/nightly.json' --exclude 'install/nightly.txt' --no-progress \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp dist/updates "s3://$R2_BUCKET/" --recursive --exclude '*' --include '*.yml' --no-progress \
            --cache-control 'no-cache' --content-type 'text/yaml'
          aws s3 cp "dist/updates/install/$CHANNEL.json" "s3://$R2_BUCKET/install/$CHANNEL.json" --no-progress \
            --cache-control 'no-cache' --content-type 'application/json'
          aws s3 cp "dist/updates/install/$CHANNEL.txt" "s3://$R2_BUCKET/install/$CHANNEL.txt" --no-progress \
            --cache-control 'no-cache' --content-type 'text/plain'
      # hexbot.app lists recent nightlies from this file (docs/channels.md).
      - name: Update the nightly index
        if: env.HAS_R2 == 'true' && env.CHANNEL == 'nightly'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws s3 cp "s3://$R2_BUCKET/nightlies.json" existing-nightlies.json --no-progress || echo '{}' > existing-nightlies.json
          node scripts/desktop/update-nightly-index.mjs --version "$VERSION" --commit "$GITHUB_SHA" --index existing-nightlies.json --out dist/nightlies.json
          aws s3 cp dist/nightlies.json "s3://$R2_BUCKET/nightlies.json" --no-progress \
            --cache-control 'no-cache' --content-type 'application/json'
      - name: Check the feed the apps will read
        if: env.HAS_R2 == 'true'
        run: |
          set -euo pipefail
          feed=$([ "$CHANNEL" = stable ] && echo latest || echo nightly)
          signed='import {readFileSync} from "node:fs"; import {releaseKeys, verifies} from "./scripts/desktop/update-signing.mjs"; const [manifest, signature] = process.argv.slice(1); if (!verifies(releaseKeys(), readFileSync(manifest), readFileSync(signature, "utf8"))) { console.error(`::error::${manifest} is not signed by the release key`); process.exit(1) }'
          for path in full/mac/arm64/$feed-mac.yml full/mac/x64/$feed-mac.yml full/linux/x64/$feed-linux.yml \
                      client/mac/arm64/$feed-mac.yml client/mac/x64/$feed-mac.yml client/linux/x64/$feed-linux.yml; do
            url="https://updates.hexbot.app/$path"
            if curl -fsS --retry 5 --retry-delay 5 "$url" | grep -x "version: $VERSION" > /dev/null; then
              echo "ok  $url"
            else
              echo "::error::$url does not announce $VERSION. Check the R2 custom domain and the bucket name ($R2_BUCKET)."
              exit 1
            fi
          done
          for target in macos-aarch64 macos-x86_64 linux-x86_64; do
            url="https://updates.hexbot.app/daemon/native/$VERSION/$target/manifest.json"
            curl -fsS --retry 5 --retry-delay 5 "$url" > native-manifest.json
            curl -fsS --retry 5 --retry-delay 5 "$url.sig" > native-manifest.json.sig
            node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("native-manifest.json")); if(m.version!==process.env.VERSION || m.format!=="tar.gz") process.exit(1)'
            node --input-type=module -e "$signed" native-manifest.json native-manifest.json.sig
            echo "ok  $url"
          done
          url="https://updates.hexbot.app/install/$CHANNEL.json"
          curl -fsS --retry 5 --retry-delay 5 "$url" > install-manifest.json
          curl -fsS --retry 5 --retry-delay 5 "https://updates.hexbot.app/install/$VERSION/$CHANNEL.json.sig" > install-manifest.json.sig
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("install-manifest.json")); if(m.version!==process.env.VERSION || m.channel!==process.env.CHANNEL || m.schema!==1) process.exit(1)'
          node --input-type=module -e "$signed" install-manifest.json install-manifest.json.sig
          echo "ok  $url"
          url="https://updates.hexbot.app/daemon/hexbot-src-$VERSION.tar.gz"
          if curl -fsSI --retry 5 --retry-delay 5 "$url" > /dev/null; then
            echo "ok  $url"
          else
            echo "::error::$url is missing; daemons cannot update themselves to $VERSION."
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          LATEST: ${{ needs.preflight.outputs.latest }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$CHANNEL" = stable ]; then
            title="Hexbot $VERSION"
            notes=docs/releases/$VERSION.md
            if [ -f "$notes" ]; then
              notes_args=(--notes-file "$notes")
            elif [ -n "$PREVIOUS_TAG" ]; then
              notes_args=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
            else
              notes_args=(--generate-notes)
            fi
          else
            title="Hexbot Nightly $VERSION (${GITHUB_SHA::7})"
            {
              printf 'Commit: %s\n\n' "$GITHUB_SHA"
              printf 'Automated build of main. May break; back up ~/.hexbot before opening it (docs/channels.md).\n'
              if [ -n "$PREVIOUS_TAG" ]; then
                printf '\nChanges: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$TAG"
              fi
            } > notes.md
            notes_args=(--notes-file notes.md)
          fi
          # The feed files stay on updates.hexbot.app; both editions write a
          # latest-linux.yml and GitHub asset names must be unique.
          assets=(release/full/*.{dmg,zip,AppImage,deb,blockmap} release/client/*.{dmg,zip,AppImage,deb,blockmap} release/daemon/*.tar.gz release/install/*)
          if [ "${#assets[@]}" -eq 0 ]; then echo '::error::No packages to upload'; exit 1; fi
          echo "Uploading ${#assets[@]} assets"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$title" "${notes_args[@]}" \
            --prerelease="$PRERELEASE" --latest="$LATEST" "${assets[@]}"
      - name: Keep the last 14 nightlies
        if: env.CHANNEL == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | test("-nightly\\."))] | sort_by(.createdAt) | reverse | .[14:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting nightly $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
      # The download page reads the nightly feed while it builds
      # (apps/site/src/lib/nightly.ts), so rebuild it now that the feed moved.
      # Stable needs no hook: `finalize` pushes to main, which Vercel builds.
      - name: Redeploy hexbot.app
        if: env.CHANNEL == 'nightly' && env.HAS_R2 == 'true' && env.HAS_SITE_HOOK == 'true'
        run: curl -fsS -X POST "${{ secrets.SITE_DEPLOY_HOOK_URL }}" > /dev/null && echo 'Site deploy requested'
      - name: Summary
        run: |
          {
            echo "## Hexbot $CHANNEL $VERSION"
            echo
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            if [ "$HAS_R2" = true ]; then echo "- Update feed: uploaded to updates.hexbot.app"; else echo "- Update feed: **not uploaded** (R2 secrets missing); installed apps will not see this release"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: Finalize
    needs: [preflight, publish]
    if: needs.preflight.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-mac-*'
          path: artifacts
      - name: Point the website and the casks at the release
        run: |
          set -euo pipefail
          mkdir -p release/full release/client
          cp artifacts/full-*/*.dmg release/full/
          cp artifacts/client-*/*.dmg release/client/
          node scripts/desktop/finalize-release.mjs "$VERSION" release/full release/client
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/site/public/downloads/manifest.json packaging/homebrew
          if git diff --cached --quiet; then
            echo 'Nothing to finalize'
            exit 0
          fi
          git commit -m "release: point downloads and casks at $VERSION"
          git push origin HEAD:main
      # The push above makes Vercel build hexbot.app from main (docs/deploy.md),
      # so unlike a nightly this job does not call SITE_DEPLOY_HOOK_URL.
